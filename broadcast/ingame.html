<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>HCI Broadcast - In-Game Overlay</title>
  <link rel="stylesheet" href="css/ingame.css">
</head>
<body>
  <main id="ingameOverlay" class="ingame-overlay" aria-label="Overlay pertandingan Honor of Kings">
    <section class="live-scoreboard" aria-label="Scoreboard pertandingan">
      <div class="series-edge series-edge-blue">
        <span>SERIES</span>
        <strong id="blueSeriesScore">0</strong>
      </div>

      <section class="team-live team-live-blue" aria-label="Blue side">
        <div id="blueTeamLogo" class="team-logo">BL</div>

        <div class="team-identity">
          <span class="side-label">BLUE SIDE</span>
          <strong id="blueTeamName" class="team-name">BLUE TEAM</strong>
        </div>

        <div class="objective-pack objective-pack-blue">
          <div class="objective-pill">
            <span class="objective-mark">T</span>
            <span>TYRANT</span>
            <strong id="blueTyrant">0</strong>
          </div>
          <div class="objective-pill">
            <span class="objective-mark">O</span>
            <span>OVERLORD</span>
            <strong id="blueOverlord">0</strong>
          </div>
        </div>

        <div class="team-gold team-gold-blue">
          <span>TEAM GOLD</span>
          <strong id="blueGold">0</strong>
        </div>
      </section>

      <section class="score-core" aria-label="Kill score dan game timer">
        <div class="score-core-top">
          <span id="seriesLabel" class="series-label">BO3</span>
          <span class="live-label">LIVE MATCH</span>
        </div>

        <div class="kill-clock-row">
          <strong id="blueKills" class="kill-score kill-score-blue">0</strong>

          <div class="clock-stack">
            <span>GAME TIME</span>
            <time id="gameTimer" class="game-clock" datetime="PT0S">00:00</time>
          </div>

          <strong id="redKills" class="kill-score kill-score-red">0</strong>
        </div>

        <div id="goldAdvantage" class="gold-lead is-even">GOLD EVEN</div>
      </section>

      <section class="team-live team-live-red" aria-label="Red side">
        <div class="team-gold team-gold-red">
          <span>TEAM GOLD</span>
          <strong id="redGold">0</strong>
        </div>

        <div class="objective-pack objective-pack-red">
          <div class="objective-pill">
            <strong id="redTyrant">0</strong>
            <span>TYRANT</span>
            <span class="objective-mark">T</span>
          </div>
          <div class="objective-pill">
            <strong id="redOverlord">0</strong>
            <span>OVERLORD</span>
            <span class="objective-mark">O</span>
          </div>
        </div>

        <div class="team-identity team-identity-red">
          <span class="side-label">RED SIDE</span>
          <strong id="redTeamName" class="team-name">RED TEAM</strong>
        </div>

        <div id="redTeamLogo" class="team-logo">RD</div>
      </section>

      <div class="series-edge series-edge-red">
        <span>SERIES</span>
        <strong id="redSeriesScore">0</strong>
      </div>
    </section>
  </main>

  <script src="js/ingame.js"></script>
</body>
</html>
