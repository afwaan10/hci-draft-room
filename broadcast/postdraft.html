<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>HCI Broadcast - Post-Draft</title>
  <link rel="stylesheet" href="css/extras.css">
</head>
<body class="broadcast-extra-body">
  <main id="postdraftOverlay" class="extra-overlay is-hidden">
    <section class="postdraft-stage">
      <header class="extra-scorebar">
        <div class="extra-team-head"><div id="postBlueLogo" class="extra-team-logo">BL</div><div class="extra-team-copy"><span>BLUE SIDE</span><strong id="postBlueName">BLUE TEAM</strong></div></div>
        <div class="extra-score-center"><span>POST-DRAFT</span><strong id="postSeries">BO3</strong></div>
        <div class="extra-team-head is-red"><div class="extra-team-copy"><span>RED SIDE</span><strong id="postRedName">RED TEAM</strong></div><div id="postRedLogo" class="extra-team-logo">RD</div></div>
      </header>
      <div class="postdraft-grid"><section id="postBluePicks" class="postdraft-side"></section><section id="postRedPicks" class="postdraft-side"></section></div>
    </section>
  </main>
  <script src="js/heroes-data.js"></script>
  <script src="js/postdraft.js"></script>
</body>
</html>
